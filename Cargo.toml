[package]
name = "dictations"
version = "0.1.2"
edition = "2024"

[workspace]
members = ["crates/qwen-asr", "crates/keytap"]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"

[dependencies]
cpal = "0.15.3"
enigo = { version = "0.6.1", default-features = false }
hound = "3.5.1"
qwen-asr = { path = "crates/qwen-asr" }
keytap = { path = "crates/keytap", default-features = false }
tempfile = "3.23.0"
serde_json = "1.0"
parakeet-rs = "0.4"

